[package]
name = "coders-bible-desktop"
version = "2.1.0"
description = "The Coder's Bible — Sovereign knowledge engine. Zero AI. Zero network."
authors = ["VrtxOmega <veritas@sovereign>"]
license = "MIT"
repository = "https://github.com/vrtxomega/the-coders-bible"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-updater = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-fs = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled-full"] }
regex = "1.10"
once_cell = "1.19"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
dirs = "5.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
